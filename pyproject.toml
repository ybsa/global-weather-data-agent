[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-weather-data-agent"
version = "0.1.0"
description = "Provenance-first global weather collection and dataset export."
requires-python = ">=3.11"

[project.scripts]
weather-agent = "weather_agent.cli:main"
timesfm-export = "project1_data_agent.run_export:main"

[tool.setuptools]
packages = ["weather_agent", "project1_data_agent"]

