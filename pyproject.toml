[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-weather-data-agent"
version = "0.1.0"
description = "Universal open-source global weather scraper, dynamic geocoder, and ML dataset exporter."
requires-python = ">=3.11"

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools]
packages = ["data_agent"]
